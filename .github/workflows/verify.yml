name: Verificar e empacotar Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar reconhecimento local sem baixar modelos ou gerar voz
        run: |
          python -m pip install faster-whisper==1.2.1 av==15.1.0 sherpa-onnx==1.13.8
          python scripts/check-local-speech.py
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - name: Compilar instalador e verificar pacote sem instalar
        shell: powershell
        run: ./scripts/Build-Release.ps1
      - name: Validar instalação limpa no Windows, sem login ou geração de voz
        shell: powershell
        run: |
          $stage = Get-ChildItem .build -Directory -Filter 'payload-*' | Select-Object -First 1
          $profile = Join-Path $env:RUNNER_TEMP 'perfil-de-teste.json'
          [IO.File]::WriteAllText($profile, '{"displayName":"Pessoa de teste","city":"Recife, PE","timezone":"America/Recife"}', [Text.UTF8Encoding]::new($false))
          & (Join-Path $stage.FullName 'installer\Install-Community.ps1') -Destination $stage.FullName -ProfilePath $profile
          if ($LASTEXITCODE -ne 0) { throw 'Falha na instalação limpa.' }
          $runtime = Get-Content (Join-Path $stage.FullName '.local\runtime-paths.json') -Raw | ConvertFrom-Json
          Push-Location $stage.FullName
          try {
            & $runtime.node scripts/verify-installed.mjs
            if ($LASTEXITCODE -ne 0) { throw 'As gravações não foram validadas.' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: release/*
          retention-days: 14
